server.port=${HMG_PORT:4321}
spring.datasource.url=${HMG_DATABASE_URL}
spring.datasource.username=${HMG_DATABASE_USER}
spring.datasource.password=${HMG_DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OPENDATA_ISSUER_URI}
server.error.include-message=never
